[project]
name = "researchrepo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.151",
    "inspect-evals>=0.3.102",
    "ipywidgets>=8.1.8",
    "openai>=2.8.1",
    "vllm>=0.11.0",
]

[tool.uv]
# Require that the package is available for macOS ARM and x86 (Intel).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
inspect-evals = { git = "https://github.com/UKGovernmentBEIS/inspect_evals.git" }

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "uv>=0.9.14",
]
